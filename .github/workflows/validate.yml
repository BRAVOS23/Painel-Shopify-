name: Validar painel
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: npm test
      - run: npm run check:worker
      - name: API, recuperação, navegador e Workerd com dados de teste
        run: npx firebase emulators:exec --project demo-painel --only auth,firestore 'node scripts/validate-local.mjs'
